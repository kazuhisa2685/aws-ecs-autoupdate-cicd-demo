AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront distribution in front of the ALB

Parameters:
  ProjectName:
    Type: String
    Default: bg-demo
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} CDN"
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Origins:
          - Id: alb
            DomainName: !ImportValue
              Fn::Sub: "${ProjectName}-alb-dns"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only   # use https-only once the ALB has an ACM certificate
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
