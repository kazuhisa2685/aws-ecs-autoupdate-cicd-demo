name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ対象の環境を選択してください (dev / stg / prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  AWS_REGION: ap-northeast-1
  ENV: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      # CloudFormation デプロイ
      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: sbcntr-infra-${{ github.ref_name }} # スタック名に環境を入れる
          template: 04_pre.yml
          # ここが「B案」の核心：デフォルト値を無視して上書きする
          parameter-overrides: >-
            Environment=${{ github.ref_name }},
            VpcId=/BlueGreen-${{ github.ref_name }}/vpc-id,
            PublicSubnetA=/BlueGreen-${{ github.ref_name }}/ingress-subnet-a-id
          no-fail-on-empty-changeset: "1" # 変更がない場合にエラーにしない